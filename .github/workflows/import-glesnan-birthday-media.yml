name: Import Glesnan birthday media
on:
  push:
    paths:
      - '.github/workflows/import-glesnan-birthday-media.yml'

permissions:
  contents: write

jobs:
  import-glesnan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download Glesnan's photo and greeting video
        run: |
          python3 -m pip install --quiet gdown==5.2.0
          gdown --id "1qFq_j51aKI6Wkx0D9vXbh5lvqunN7JSA" --output "glesnan.jpg"
          gdown --id "1JyxWyZ2DnYUJqGiF9wdfEv7mEBQWcGpm" --output "/tmp/glesnan_original.mov"
          test -s glesnan.jpg
          test -s /tmp/glesnan_original.mov
      - name: Convert greeting to browser compatible MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -nostdin -y -hide_banner -loglevel error -i /tmp/glesnan_original.mov \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart glesnan_greeting.mp4
          test -s glesnan_greeting.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 glesnan_greeting.mp4
      - name: Save both files to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glesnan.jpg glesnan_greeting.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add Glesnan portrait and birthday greeting"
            git push
          fi
