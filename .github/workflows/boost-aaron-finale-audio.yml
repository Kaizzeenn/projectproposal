name: Moderate audio boost for Aaron's personal finale
on:
  push:
    paths:
      - '.github/workflows/boost-aaron-finale-audio.yml'

permissions:
  contents: write

jobs:
  boost-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify original personal video
        run: |
          test -s aaron_finale.mp4
          test "$(git hash-object aaron_finale.mp4)" = "ee91632e2d2bcce1d4b2497e93bac8006aaa9622"
          python3 -m pip install --quiet imageio-ffmpeg
      - name: Measure original audio loudness
        run: |
          FFMPEG="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -nostdin -hide_banner -i aaron_finale.mp4 -vn \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11:print_format=summary" \
            -f null - 2>&1 | tee /tmp/before-audio.txt
      - name: Normalize voice loudness without changing video frames
        run: |
          FFMPEG="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -nostdin -y -hide_banner -loglevel info -i aaron_finale.mp4 \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy -c:a aac -b:a 160k -ar 48000 \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11:print_format=summary" \
            -movflags +faststart aaron_finale_boosted.mp4
          test -s aaron_finale_boosted.mp4
      - name: Verify improved audio and preserved video
        run: |
          FFMPEG="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -nostdin -hide_banner -i aaron_finale_boosted.mp4 -vn \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11:print_format=summary" \
            -f null - 2>&1 | tee /tmp/after-audio.txt
          "$FFMPEG" -nostdin -hide_banner -i aaron_finale.mp4 -map 0:v:0 -c copy -f hash - 2>&1 | tail -2 > /tmp/video-before-hash.txt
          "$FFMPEG" -nostdin -hide_banner -i aaron_finale_boosted.mp4 -map 0:v:0 -c copy -f hash - 2>&1 | tail -2 > /tmp/video-after-hash.txt
          grep '^SHA256=' /tmp/video-before-hash.txt > /tmp/raw-hash-before.txt
          grep '^SHA256=' /tmp/video-after-hash.txt > /tmp/raw-hash-after.txt
          diff -u /tmp/raw-hash-before.txt /tmp/raw-hash-after.txt
          ls -lh aaron_finale.mp4 aaron_finale_boosted.mp4
      - name: Replace hosted video
        run: |
          mv aaron_finale_boosted.mp4 aaron_finale.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aaron_finale.mp4
          git commit -m "Moderately normalize Aaron finale voice audio; preserve original video stream"
          git push
