name: Add Marjie's lock screen photo
on:
  push:
    paths:
      - '.github/workflows/import-marjie-lock-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Marjie's original photo
        run: |
          python3 -m pip install --quiet "gdown==5.2.0" pillow
          gdown --id "1HebLdgGI1aFKsnVSDDYWQeM8KbRT7yaW" --output "/tmp/marjie_lock_photo_source.png"
          test -s "/tmp/marjie_lock_photo_source.png"
      - name: Save web-optimized photo without altering its contents
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          im=Image.open("/tmp/marjie_lock_photo_source.png")
          im=ImageOps.exif_transpose(im).convert("RGB")
          if im.width > 1280:
              im.thumbnail((1280, 1280), Image.Resampling.LANCZOS)
          im.save("marjie_lock_photo.jpg", "JPEG", quality=88, optimize=True, progressive=True)
          print("Saved", im.size, "bytes:", __import__('os').path.getsize("marjie_lock_photo.jpg"))
          PY
          test -s marjie_lock_photo.jpg
      - name: Commit photo to GitHub Pages repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marjie_lock_photo.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add Marjie's original photo to lock screen"
            git push
          fi
