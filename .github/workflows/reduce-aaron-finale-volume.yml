name: Soften Aaron finale audio after normalization
on:
  push:
    paths:
      - '.github/workflows/reduce-aaron-finale-volume.yml'

permissions:
  contents: write

jobs:
  soften-finale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check current hosted video and FFmpeg
        run: |
          test -s aaron_finale.mp4
          test "$(git hash-object aaron_finale.mp4)" = "c9ed36de87c6efe29261c9eaa2a8b35bd7e13e8a"
          python3 -m pip install --quiet imageio-ffmpeg
      - name: Reduce volume moderately without re-encoding video frames
        run: |
          FFMPEG="$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -nostdin -y -hide_banner -loglevel error -i aaron_finale.mp4 \
            -map 0:v:0 -map 0:a:0 -c:v copy -c:a aac -b:a 160k -ar 48000 \
            -af "volume=-4dB" -movflags +faststart aaron_finale_softer.mp4
          test -s aaron_finale_softer.mp4
      - name: Verify unchanged footage and measured audio level
        run: |
          FFMPEG="$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -nostdin -y -hide_banner -loglevel error -i aaron_finale.mp4 -map 0:v:0 -c:v copy -f h264 /tmp/before.h264
          "$FFMPEG" -nostdin -y -hide_banner -loglevel error -i aaron_finale_softer.mp4 -map 0:v:0 -c:v copy -f h264 /tmp/after.h264
          cmp /tmp/before.h264 /tmp/after.h264
          echo "Video elementary streams identical:"
          sha256sum /tmp/before.h264 /tmp/after.h264
          "$FFMPEG" -nostdin -hide_banner -i aaron_finale_softer.mp4 -vn \
            -af "loudnorm=I=-20:TP=-1.5:LRA=11:print_format=summary" -f null - 2>&1 | tee /tmp/softer-audio-stats.txt
          grep -A 4 "Input Integrated" /tmp/softer-audio-stats.txt | tail -5
          ls -lh aaron_finale.mp4 aaron_finale_softer.mp4
      - name: Replace hosted personal finale recording
        run: |
          mv aaron_finale_softer.mp4 aaron_finale.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aaron_finale.mp4
          git commit -m "Lower personal finale audio by 4 dB, preserve exact video frames"
          git push
