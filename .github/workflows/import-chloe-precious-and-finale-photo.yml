name: Add Chloe Precious greeting and personal finale photo
on:
  push:
    paths:
      - '.github/workflows/import-chloe-precious-and-finale-photo.yml'
permissions:
  contents: write
jobs:
  import-birthday-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download original submitted media
        run: |
          python3 -m pip install --quiet "gdown==5.2.0" "pillow>=11" "pillow-heif>=0.20"
          gdown --id "1MeVua2N-cpehfERJ-8WaSuwIW4_4pQQb" --output "/tmp/chloe_precious_source.HEIC"
          gdown --id "1CxJ3gGtXs4P7k-QKZo7jkJW42Jg7-3sV" --output "/tmp/chloe_precious_source.mov"
          gdown --id "1iH4V6UzhOwsndXIdvP6XYCkcES7GCYII" --output "aaron_marjie_finale.jpg"
          test -s /tmp/chloe_precious_source.HEIC
          test -s /tmp/chloe_precious_source.mov
          test -s aaron_marjie_finale.jpg
      - name: Convert portrait HEIC to browser JPEG
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pillow_heif import register_heif_opener
          register_heif_opener()
          im=ImageOps.exif_transpose(Image.open("/tmp/chloe_precious_source.HEIC")).convert("RGB")
          im.thumbnail((1500,1500), Image.Resampling.LANCZOS)
          im.save("chloe_precious.jpg", "JPEG", quality=88, optimize=True, progressive=True)
          print("JPEG dimensions:",im.size)
          PY
          test -s chloe_precious.jpg
      - name: Convert greeting MOV to MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -nostdin -y -hide_banner -loglevel error -i /tmp/chloe_precious_source.mov \
            -c:v libx264 -preset veryfast -crf 25 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart chloe_precious_greeting.mp4
          test -s chloe_precious_greeting.mp4
          ffprobe -v error -show_entries format=duration,size -of csv=p=0 chloe_precious_greeting.mp4
      - name: Publish three birthday media files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chloe_precious.jpg chloe_precious_greeting.mp4 aaron_marjie_finale.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add Chloe Precious greeting and Aaron Marjie finale photo"
            git push
          fi
