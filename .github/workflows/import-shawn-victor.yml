name: Import Shawn and Victor birthday greeting
on:
  push:
    paths:
      - .github/workflows/import-shawn-victor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the shared video
        run: |
          python3 -m pip install --quiet "gdown==5.2.0"
          gdown --id "1YYPhmVCjmDhyALkwyNFFWoQKeWHuE0xk" --output "/tmp/shawn_victor_source.mov"
          test -s /tmp/shawn_victor_source.mov
      - name: Convert to compatible compressed MP4
        run: |
          ffmpeg -nostdin -y -hide_banner -loglevel error -i /tmp/shawn_victor_source.mov \
            -vf "scale=854:-2,fps=24" -c:v libx264 -preset veryfast -crf 28 \
            -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart \
            shawn_victor_greeting.mp4
          test -s shawn_victor_greeting.mp4
      - name: Save the playable video to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shawn_victor_greeting.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Host Shawn and Victor greeting locally for birthday website"
            git push
          fi
