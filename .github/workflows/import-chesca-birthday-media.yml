name: Import Chesca birthday greeting photo and video
on:
  push:
    paths:
      - '.github/workflows/import-chesca-birthday-media.yml'

permissions:
  contents: write

jobs:
  import-chesca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Chesca's picture and full greeting
        run: |
          python3 -m pip install --quiet 'gdown==5.2.0' imageio-ffmpeg
          gdown --id '1Kw_isSGWj22GjGNMpoPFNWY_jdXe6Nky' --output chesca.jpg
          gdown --id '1khw54qTyuMVL2pBLezCEk57CeqJiyeMX' --output /tmp/chesca_source.mp4
          test -s chesca.jpg
          test -s /tmp/chesca_source.mp4
          ls -lh chesca.jpg /tmp/chesca_source.mp4
      - name: Prepare browser-friendly video without changing its content
        run: |
          FFMPEG="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -nostdin -y -hide_banner -loglevel error -i /tmp/chesca_source.mp4 \
            -map 0:v:0 -map 0:a:0? -vf "scale=960:-2,fps=24" \
            -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart chesca_greeting.mp4
          test -s chesca_greeting.mp4
          ls -lh chesca_greeting.mp4
      - name: Publish Chesca's media on the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chesca.jpg chesca_greeting.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add Chesca photo and birthday video for Inner Circle"
            git push
          fi
