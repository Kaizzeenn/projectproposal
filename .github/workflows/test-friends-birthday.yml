name: Verify friends birthday website
on:
  push:
    paths:
      - .github/workflows/test-friends-birthday.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test friends-only birthday interaction
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/friends.log 2>&1 &
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{width:390,height:844},{width:1280,height:800}]){
              const page=await browser.newPage({viewport}),errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8899/friends/',{waitUntil:'domcontentloaded'});
              if(await page.locator('#personalReveal').count())throw Error('Private finale present');
              if(!await page.locator('.hero-collage-single .hero-party-hat').count())throw Error('Party hat missing');
              for(const digit of '1119')await page.locator('#numberPad [data-digit="'+digit+'"]').click();
              await page.waitForFunction(()=>document.querySelector('#lockScreen')?.hidden,{timeout:8000});
              if(await page.locator('#memoryGrid .memory-card').count()!==6)throw Error('Gallery incomplete');
              if(await page.locator('#appreciationWall .ap-note').count()!==10)throw Error('Appreciation notes missing');
              await page.locator('#innerCard [data-action="video"]').click();
              await page.waitForFunction(()=>document.querySelector('#mediaModal video')?.readyState>0,null,{timeout:20000});
              await page.locator('.modal-close').click();
              await page.locator('#memoryGrid .memory-card').nth(3).click();
              await page.waitForFunction(()=>document.querySelector('#mediaModal video')?.readyState>0,null,{timeout:20000});
              await page.locator('.modal-close').click();
              for(let i=0;i<3;i++)await page.locator('.mf-toggle').nth(i).click();
              if(!await page.locator('#mfBonus').isVisible())throw Error('Bonus file missing');
              for(let i=0;i<3;i++)await page.locator('.candle').nth(i).click();
              await page.locator('#finishStory').click();
              if(!await page.locator('#fakeEnd').isVisible())throw Error('Ending missing');
              await page.locator('#endButton').click();
              if(errors.length)throw Error('Browser errors: '+errors.join('; '));
              console.log(viewport.width+'px Friends birthday PASS');
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
