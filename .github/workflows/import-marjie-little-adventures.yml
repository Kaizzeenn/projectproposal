name: Import Marjie's Little adventures photo
on:
  push:
    paths:
      - '.github/workflows/import-marjie-little-adventures.yml'

permissions:
  contents: write

jobs:
  add-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download original Little adventures photo
        run: |
          python3 -m pip install --quiet gdown==5.2.0
          gdown --id "1pmyrTD3xQn70uMjTDl4K-DZhk1iiTrKa" --output "marjie_little_adventures.png"
          test -s marjie_little_adventures.png
      - name: Save photo to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marjie_little_adventures.png
          if ! git diff --cached --quiet; then
            git commit -m "Add Little adventures photo to Marjie's birthday gallery"
            git push
          fi
