name: Add Marjie funny photo
on:
  push:
    paths:
      - '.github/workflows/import-funny-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-funny-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the original Funny photos picture
        run: |
          python3 -m pip install --quiet "gdown==5.2.0" pillow
          gdown --id "1SYfwZYQT-3mLJgIIv4x9iAhcc9ZPgHHs" --output "/tmp/marjie_funny_photo_source.png"
          test -s /tmp/marjie_funny_photo_source.png
      - name: Save browser-compatible photo (no AI editing)
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          import os
          im=Image.open("/tmp/marjie_funny_photo_source.png")
          im=ImageOps.exif_transpose(im).convert("RGB")
          im.save("marjie_funny_photo.jpg", "JPEG", quality=90, optimize=True, progressive=True)
          print("Photo dimensions:", im.size, "file bytes:", os.stat("marjie_funny_photo.jpg").st_size)
          PY
          test -s marjie_funny_photo.jpg
      - name: Commit photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marjie_funny_photo.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Upload Marjie Funny photos memory"
            git push
          fi
