name: Import Aaron's personal birthday video
on:
  push:
    paths:
      - '.github/workflows/import-aaron-personal-finale.yml'

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download original personal birthday video
        run: |
          python3 -m pip install --quiet gdown==5.2.0
          gdown --id "1WX6YSRdWZ5XvNxvgMirMGIqMVSULR_1X" --output "/tmp/aaron_personal_source.mp4"
          test -s /tmp/aaron_personal_source.mp4
      - name: Convert video for the birthday website
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -nostdin -y -hide_banner -loglevel error -i /tmp/aaron_personal_source.mp4 \
            -vf "scale=1280:-2" -c:v libx264 -preset veryfast -crf 28 \
            -pix_fmt yuv420p -c:a aac -b:a 112k -movflags +faststart \
            aaron_finale.mp4
          test -s aaron_finale.mp4
          ls -lh aaron_finale.mp4
          ffprobe -v error -show_entries format=duration,size -of csv=p=0 aaron_finale.mp4
      - name: Publish personal birthday video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aaron_finale.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add Aaron's personal birthday finale video"
            git push
          fi
