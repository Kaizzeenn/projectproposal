name: Build Marjie birthday offline Windows package
on:
  push:
    paths:
      - .github/workflows/build-birthday-offline-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check website JavaScript syntax and link all media
        run: |
          node --check app.js
          node --check content.js
          node --check appreciation.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const context={};vm.createContext(context);
          vm.runInContext(fs.readFileSync('content.js','utf8')+';globalThis.birthday=BDAY;',context);
          const d=context.birthday,paths=[];
          for(const x of [...d.innerCircle,...d.birthdayMessages,...d.memories]){
            for(const key of ['photo','video'])if(x[key])paths.push(x[key]);
          }
          for(const k of ['video','couplePhoto'])if(d.personal[k])paths.push(d.personal[k]);
          for(const src of [...fs.readFileSync('index.html','utf8').matchAll(/(?:src|data-gift-image)="([^"]+\.(?:mp4|png|jpe?g|webp))"/g)])paths.push(src[1]);
          const missing=[...new Set(paths)].filter(p=>!fs.existsSync(p));
          if(missing.length)throw Error('Missing media: '+missing.join(', '));
          console.log('Checked',paths.length,'media references. All files are present.');
          console.log('Friend cards:', d.innerCircle.length+d.birthdayMessages.length);
          console.log('Gallery memories:', d.memories.length);
          console.log('Appreciation messages:', d.appreciationNotes.filter(x=>x.quote.trim()).length,'of',d.appreciationNotes.length);
          NODE

      - name: Assemble offline static website
        run: |
          mkdir -p offline-launcher/static
          shopt -s nullglob
          cp -- *.html *.css *.js *.png *.jpg *.jpeg *.webp *.mp4 offline-launcher/static/
          test -s offline-launcher/static/index.html
          test -s offline-launcher/static/aaron_finale.mp4
          test -s offline-launcher/static/shawn_victor_greeting.mp4
          test -s offline-launcher/static/chloe_precious_greeting.mp4
          find offline-launcher/static -type f | wc -l
          du -sh offline-launcher/static

      - name: Install Go build environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Compile fully self-contained Windows launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" -o Marjie_Birthday_Portable.exe ./offline-launcher/main.go
          test -s Marjie_Birthday_Portable.exe
          file Marjie_Birthday_Portable.exe
          ls -lh Marjie_Birthday_Portable.exe

      - name: Build Windows installer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          makensis -V2 -DROOT="$PWD" offline-launcher/installer.nsi
          test -s Marjie_Birthday_Offline_Setup.exe
          file Marjie_Birthday_Offline_Setup.exe
          ls -lh Marjie_Birthday_Offline_Setup.exe

      - name: Prepare portable offline backup
        run: |
          cat > OFFLINE_READ_ME_FIRST.txt <<'TXT'
          MARJIE'S BIRTHDAY SURPRISE — OFFLINE FOR WINDOWS

          Recommended:
          1. Double-click Marjie_Birthday_Offline_Setup.exe.
          2. Complete the setup wizard; a desktop shortcut will be created.
          3. Launch Marjie Birthday Surprise from your desktop.
          4. Your usual browser opens on localhost. Code: 1119.
          5. Keep the black launcher window open while viewing the site.
          6. Close the launcher window to stop the offline website.

          Portable option:
          - Run Marjie_Birthday_Portable.exe directly, without installing.
          - Your browser will open locally. Keep its launcher window open.
          - A normal browser must already be installed (Edge/Chrome/etc.).

          Every photo, MP4 video, letter and website file is EMBEDDED inside
          the program. Internet and Google Drive are NOT required.

          Windows may show a SmartScreen warning because this personal build
          is not digitally code-signed. Only run the file if you trust its source.
          TXT
          zip -j -9 -q Marjie_Birthday_Portable_Backup.zip Marjie_Birthday_Portable.exe OFFLINE_READ_ME_FIRST.txt
          ls -lh Marjie_Birthday_Portable_Backup.zip
          sha256sum Marjie_Birthday_Offline_Setup.exe Marjie_Birthday_Portable.exe Marjie_Birthday_Portable_Backup.zip > OFFLINE_SHA256SUMS.txt

      - name: Upload setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Marjie_Birthday_Offline_Setup
          path: Marjie_Birthday_Offline_Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload portable backup
        uses: actions/upload-artifact@v4
        with:
          name: Marjie_Birthday_Offline_Portable_Backup
          path: |
            Marjie_Birthday_Portable_Backup.zip
            OFFLINE_READ_ME_FIRST.txt
            OFFLINE_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
